<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Animal Picture App</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        fieldset { border: 1px solid #ccc; padding: 1rem; display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; }
        label { display: flex; flex-direction: column; font-size: .9rem; gap: .25rem; }
        select, input, button { font-size: 1rem; padding: .35rem .5rem; }
        #status { min-height: 1.5rem; margin: 1rem 0; }
        #status.error { color: #b00020; }
        #pictures { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        figure { margin: 0; border: 1px solid #ddd; padding: .5rem; }
        figure img { width: 100%; height: auto; display: block; }
        figcaption { font-size: .8rem; color: #555; margin-top: .25rem; }
    </style>
</head>
<body>
<h1>Animal Picture App</h1>
<p>Fetch random pictures of an animal, store them in the database, and show the last stored one.
    API docs: <a href="/swagger-ui.html">Swagger UI</a>.</p>

<form id="form">
    <fieldset>
        <label>Animal
            <select id="animal">
                <option value="cat">Cat</option>
                <option value="dog">Dog</option>
                <option value="bear">Bear</option>
            </select>
        </label>
        <label>Number of pictures
            <input id="count" type="number" min="1" max="10" value="1" required>
        </label>
        <button type="submit" id="fetchBtn">Fetch &amp; save</button>
        <button type="button" id="latestBtn">Show last stored</button>
    </fieldset>
</form>

<div id="status" role="status"></div>
<div id="pictures"></div>

<script>
    const form = document.getElementById('form');
    const animal = document.getElementById('animal');
    const count = document.getElementById('count');
    const statusEl = document.getElementById('status');
    const pictures = document.getElementById('pictures');
    const buttons = document.querySelectorAll('button');

    function setStatus(text, isError = false) {
        statusEl.textContent = text;
        statusEl.className = isError ? 'error' : '';
    }

    function setBusy(busy) {
        buttons.forEach(b => b.disabled = busy);
    }

    function render(list) {
        pictures.replaceChildren(...list.map(p => {
            const figure = document.createElement('figure');
            const img = document.createElement('img');
            img.src = p.imageUrl;
            img.alt = 'A ' + p.animal;
            const caption = document.createElement('figcaption');
            caption.textContent = `#${p.id} · ${p.animal} · ${Math.round(p.sizeBytes / 1024)} KB · ${new Date(p.createdAt).toLocaleString()}`;
            figure.append(img, caption);
            return figure;
        }));
    }

    async function call(url, options) {
        const response = await fetch(url, options);
        const body = await response.json();
        if (!response.ok) {
            throw new Error(body.detail || response.statusText);
        }
        return body;
    }

    form.addEventListener('submit', async event => {
        event.preventDefault();
        setBusy(true);
        setStatus(`Fetching ${count.value} ${animal.value} picture(s)…`);
        try {
            const saved = await call(`/api/animals/${animal.value}/pictures?count=${count.value}`, {method: 'POST'});
            render(saved);
            setStatus(`Stored ${saved.length} ${animal.value} picture(s).`);
        } catch (e) {
            setStatus(e.message, true);
        } finally {
            setBusy(false);
        }
    });

    document.getElementById('latestBtn').addEventListener('click', async () => {
        setBusy(true);
        setStatus(`Loading the last stored ${animal.value} picture…`);
        try {
            const latest = await call(`/api/animals/${animal.value}/pictures/latest`);
            render([latest]);
            setStatus(`Last stored ${animal.value} picture:`);
        } catch (e) {
            pictures.replaceChildren();
            setStatus(e.message, true);
        } finally {
            setBusy(false);
        }
    });
</script>
</body>
</html>
