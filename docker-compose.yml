services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: animal_pictures
      POSTGRES_USER: animals
      POSTGRES_PASSWORD: animals
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animals -d animal_pictures"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: animal-picture-app:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/animal_pictures
      SPRING_DATASOURCE_USERNAME: animals
      SPRING_DATASOURCE_PASSWORD: animals
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db-data:
